[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener-ddd"
version = "0.2.0"
description = "Domain-Driven Design implementation of a stock screening system"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Uma Shankar", email = "umashankartd1991@gmail.com"}
]

dependencies = []  # standard library only

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "mypy>=0.950",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines tolerated in docstrings and tests
    "B024",  # AggregateRoot/ValueObject are deliberate marker bases
]
